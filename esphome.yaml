################################################
#
# ATHOM SMART PLUG V3 - STROMBEGRENZER + ZEITSCHALTUHR
# Standalone Version
#
# Hardware: Athom ESP32-C3 Smart Plug V3
# GPIOs: 3=Button, 5=Relay, 6=Blue LED, 20=CSE7766 RX
# Rote LED ist hardwired mit Relay
#
################################################

substitutions:
  name: power-limiter
  friendly_name: Strombegrenzer
  sensor_update_interval: 10s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    board_build.mcu: esp32c3
    board_build.variant: esp32c3
    board_build.flash_mode: dio
  on_boot:
    - priority: 600
      then:
        # Reset Timer-Variablen (fault_active bleibt true = sicher)
        - lambda: |-
            id(overload_start_time) = 0;
            id(last_cycle_start) = millis();
            id(cycle_running) = false;
        # Boot-Signal: 3x schnelles Blinken
        - repeat:
            count: 3
            then:
              - light.turn_on: blue_led
              - delay: 100ms
              - light.turn_off: blue_led
              - delay: 100ms
        - delay: 200ms
        # Fault-Status prüfen (Intervall-Initialisierung erfolgt automatisch wenn SNTP sync)
        - lambda: |-
            if (id(fault_active)) {
              // Fault aktiv - LED blinken lassen
              return;
            }
        # LED-Status setzen
        - if:
            condition:
              lambda: 'return id(fault_active);'
            then:
              - script.execute: led_blink
            else:
              - light.turn_on: blue_led

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  variant: ESP32C3
  framework:
    type: esp-idf
    version: recommended

preferences:
  flash_write_interval: 5s

logger:
  baud_rate: 0
  level: INFO

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

mdns:
  disabled: false

################################################
#
# UART für CSE7766
#
################################################

uart:
  rx_pin: GPIO20
  baud_rate: 4800
  data_bits: 8
  stop_bits: 1
  parity: EVEN

################################################
#
# GLOBALE VARIABLEN
#
################################################

globals:
  # Sicherheit (nach Boot immer Störung aktiv - restore funktioniert nicht mit ESP-IDF)
  - id: fault_active
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: overload_start_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: peak_current
    type: float
    restore_value: no
    initial_value: '0.0'

  # Zeitschaltuhr
  - id: last_cycle_start
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: cycle_running
    type: bool
    restore_value: no
    initial_value: 'false'

  # Energie
  - id: total_energy
    type: float
    restore_value: yes
    initial_value: '0.0'

  # Strom für Template-Sensor
  - id: last_current
    type: float
    restore_value: no
    initial_value: '0.0'

  # Nächster geplanter Zyklus (Unix-Timestamp, auf volle Stunde gerundet)
  - id: next_cycle_timestamp
    type: time_t
    restore_value: no
    initial_value: '0'

################################################
#
# ZEITSCHALTUHR - EINSTELLUNGEN
#
################################################

select:
  - platform: template
    name: "Intervall"
    id: timer_interval
    icon: "mdi:timer-outline"
    optimistic: true
    restore_value: true
    options:
      - "Aus"
      - "1h"
      - "2h"
      - "3h"
      - "4h"
      - "6h"
      - "8h"
      - "12h"
      - "24h"
    initial_option: "Aus"
    on_value:
      then:
        - lambda: |-
            if (i > 0) {
              // Timer aktiviert
              auto time = id(sntp_time).now();
              if (time.is_valid()) {
                // Mit SNTP: ersten Zyklus auf nächste volle Stunde planen
                static const int intervals_min[] = {0, 60, 120, 180, 240, 360, 480, 720, 1440};
                int interval_sec = intervals_min[i] * 60;
                time_t next = time.timestamp + interval_sec;
                next = ((next / 3600) + 1) * 3600;
                id(next_cycle_timestamp) = next;
              } else {
                // Ohne SNTP: millis-basiert, Planung erfolgt im Interval-Check
                id(next_cycle_timestamp) = 0;
                id(last_cycle_start) = millis();
              }
              id(cycle_running) = false;
            } else {
              // Timer deaktiviert
              id(next_cycle_timestamp) = 0;
              id(cycle_running) = false;
            }

################################################
#
# STROMBEGRENZER - EINSTELLUNGEN
#
################################################

  - platform: template
    name: "Intervalllänge"
    id: run_duration
    icon: "mdi:timelapse"
    optimistic: true
    restore_value: true
    options:
      - "1 min"
      - "2 min"
      - "3 min"
      - "4 min"
      - "5 min"
      - "6 min"
      - "7 min"
      - "8 min"
      - "9 min"
      - "10 min"
      - "11 min"
      - "12 min"
      - "13 min"
      - "14 min"
      - "15 min"
      - "16 min"
      - "17 min"
      - "18 min"
      - "19 min"
      - "20 min"
      - "21 min"
      - "22 min"
      - "23 min"
      - "24 min"
      - "25 min"
      - "26 min"
      - "27 min"
      - "28 min"
      - "29 min"
      - "30 min"
    initial_option: "5 min"

number:
  - platform: template
    name: "Stromlimit"
    id: current_limit_number
    icon: "mdi:current-ac"
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 16
    step: 0.1
    mode: box

  - platform: template
    name: "Stromlimit (Verzögerung)"
    id: trip_delay
    icon: "mdi:timer-alert-outline"
    unit_of_measurement: "ms"
    optimistic: true
    restore_value: true
    initial_value: 200
    min_value: 0
    max_value: 5000
    step: 1
    mode: box

################################################
#
# SENSOREN
#
################################################

sensor:
  # CSE7766 - Rohdaten für schnelle Abschaltung
  - platform: cse7766
    current:
      id: current_raw
      internal: true
      on_value:
        then:
          - lambda: |-
              id(last_current) = x;

              // Peak-Tracking
              if (x > id(peak_current)) {
                id(peak_current) = x;
              }

              // Keine Prüfung wenn Fault bereits aktiv oder Relay aus
              if (id(fault_active) || !id(relay_hw).state) {
                id(overload_start_time) = 0;
                return;
              }

              float limit = id(current_limit_number).state;
              uint32_t delay_ms = (uint32_t)id(trip_delay).state;
              uint32_t now = millis();

              if (limit <= 0) return;

              if (x > limit) {
                if (id(overload_start_time) == 0) {
                  id(overload_start_time) = now;
                  ESP_LOGW("limiter", "OVERLOAD START: %.3fA > %.2fA", x, limit);
                } else {
                  uint32_t elapsed = now - id(overload_start_time);
                  if (elapsed >= delay_ms) {
                    ESP_LOGW("limiter", "TRIP: %.3fA > %.2fA for %ums - FAULT", x, limit, elapsed);
                    id(fault_active) = true;
                    id(relay_hw).turn_off();
                    id(overload_start_time) = 0;
                  }
                }
              } else {
                if (id(overload_start_time) != 0) {
                  id(overload_start_time) = 0;
                }
              }

    voltage:
      id: voltage_raw
      internal: true

    power:
      id: power_raw
      internal: true

    energy:
      id: energy_raw
      internal: true
      on_value:
        then:
          - lambda: |-
              static float previous_energy_value = -1.0;
              float current_energy_value = x * 0.001;

              // Erste Messung nach Boot - nur initialisieren
              if (previous_energy_value < 0) {
                previous_energy_value = current_energy_value;
                return;
              }

              // Nur positive Deltas addieren, mit Sanity-Check
              float delta = current_energy_value - previous_energy_value;
              if (delta > 0 && delta < 1.0) {
                id(total_energy) += delta;
              }
              previous_energy_value = current_energy_value;

    apparent_power:
      id: apparent_power_raw
      internal: true

    reactive_power:
      id: reactive_power_raw
      internal: true

    power_factor:
      id: power_factor_raw
      internal: true

  # Template Sensoren für HA
  - platform: template
    name: "Strom"
    icon: mdi:current-ac
    unit_of_measurement: "A"
    accuracy_decimals: 3
    lambda: |-
      float v = id(last_current);
      return (v < 0.060) ? 0.0 : v;
    update_interval: ${sensor_update_interval}

  - platform: template
    name: "Spannung"
    icon: mdi:sine-wave
    unit_of_measurement: "V"
    accuracy_decimals: 1
    lambda: 'return id(voltage_raw).state;'
    update_interval: ${sensor_update_interval}

  - platform: template
    name: "Leistung"
    id: power_sensor
    icon: mdi:power
    unit_of_measurement: "W"
    accuracy_decimals: 1
    lambda: |-
      float v = id(power_raw).state;
      return (v < 3.0) ? 0.0 : v;
    update_interval: ${sensor_update_interval}

  - platform: template
    name: "Energie"
    icon: mdi:lightning-bolt
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    lambda: 'return id(energy_raw).state * 0.001;'
    update_interval: ${sensor_update_interval}

  - platform: template
    name: "Energie (Gesamt)"
    id: total_energy_sensor
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    icon: mdi:lightning-bolt
    accuracy_decimals: 3
    lambda: 'return id(total_energy);'
    update_interval: ${sensor_update_interval}

  - platform: total_daily_energy
    name: "Energie (Tag)"
    restore: true
    power_id: power_sensor
    unit_of_measurement: "kWh"
    icon: mdi:hours-24
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: template
    name: "Leistung (Schein)"
    icon: mdi:power
    unit_of_measurement: "VA"
    accuracy_decimals: 1
    lambda: 'return id(apparent_power_raw).state;'
    update_interval: ${sensor_update_interval}

  - platform: template
    name: "Leistung (Blind)"
    icon: mdi:flash
    unit_of_measurement: "var"
    accuracy_decimals: 1
    lambda: 'return id(reactive_power_raw).state;'
    update_interval: ${sensor_update_interval}

  - platform: template
    name: "Leistung (Faktor)"
    icon: mdi:percent-outline
    accuracy_decimals: 2
    lambda: 'return id(power_factor_raw).state;'
    update_interval: ${sensor_update_interval}

  - platform: template
    name: "Strom (Spitze)"
    id: peak_current_sensor
    unit_of_measurement: "A"
    icon: "mdi:chart-line-variant"
    accuracy_decimals: 3
    lambda: 'return id(peak_current);'
    update_interval: 1s


  - platform: template
    name: "Zyklus (verbleibend)"
    id: cycle_time_remaining
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    lambda: |-
      // Nur anzeigen wenn Zyklus läuft
      if (!id(cycle_running) || !id(relay_hw).state) {
        return NAN;
      }

      int run_idx = id(run_duration).active_index().value_or(4);
      uint32_t run_sec = (run_idx + 1) * 60;

      uint32_t elapsed_sec = (millis() - id(last_cycle_start)) / 1000;

      if (elapsed_sec >= run_sec) {
        return 0;
      }
      return run_sec - elapsed_sec;
    update_interval: 1s

  - platform: uptime
    name: "Betriebszeit"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
    entity_category: diagnostic

################################################
#
# BINARY SENSOREN
#
################################################

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  - platform: template
    name: "Störung"
    id: fault_sensor
    device_class: problem
    lambda: 'return id(fault_active);'

  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Taste"
    id: power_button
    disabled_by_default: true
    on_multi_click:
      # Kurz: Reset Fault ODER Toggle Relay
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - if:
              condition:
                lambda: 'return id(fault_active);'
              then:
                # Fault aktiv - nur zurücksetzen
                - lambda: |-
                    id(fault_active) = false;
                    id(peak_current) = 0.0;
                    id(overload_start_time) = 0;
                - script.stop: led_blink
                - light.turn_on: blue_led
              else:
                # Kein Fault - Relay togglen
                - switch.toggle: relay_hw
      # Lang 4s: Factory Reset
      - timing:
          - ON for at least 4s
        then:
          - button.press: factory_reset_button

################################################
#
# SCHALTER
#
################################################

switch:
  - platform: template
    name: "Schalter"
    id: relay_control
    icon: mdi:power-socket-eu
    lambda: 'return id(relay_hw).state;'
    turn_on_action:
      - if:
          condition:
            lambda: 'return !id(fault_active);'
          then:
            - switch.turn_on: relay_hw
    turn_off_action:
      - switch.turn_off: relay_hw


  - platform: gpio
    id: relay_hw
    pin: GPIO5
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      - light.turn_off: blue_led
      - lambda: |-
          id(overload_start_time) = 0;
          id(last_cycle_start) = millis();
          id(cycle_running) = true;
    on_turn_off:
      - lambda: 'id(cycle_running) = false;'
      - if:
          condition:
            lambda: 'return id(fault_active);'
          then:
            - script.execute: led_blink
          else:
            - light.turn_on: blue_led

  - platform: template
    name: "Sicherheitsfreigabe"
    id: safety_release
    icon: "mdi:shield-check"
    lambda: 'return !id(fault_active);'
    turn_on_action:
      - lambda: |-
          id(fault_active) = false;
          id(peak_current) = 0.0;
          id(overload_start_time) = 0;
      - script.stop: led_blink
      - light.turn_on: blue_led
    turn_off_action:
      - lambda: |-
          id(fault_active) = true;
          id(relay_hw).turn_off();

################################################
#
# LED (internal)
#
################################################

light:
  - platform: binary
    id: blue_led
    output: led_output
    internal: true

output:
  - platform: gpio
    id: led_output
    pin:
      number: GPIO6
      inverted: true

################################################
#
# SCRIPTS
#
################################################

script:
  - id: led_blink
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(fault_active);'
          then:
            - light.turn_on: blue_led
            - delay: 500ms
            - light.turn_off: blue_led
            - delay: 500ms

################################################
#
# ZEITSCHALTUHR - INTERVALL
#
################################################

interval:
  - interval: 1s
    then:
      - lambda: |-
          int idx = id(timer_interval).active_index().value_or(0);
          if (idx == 0) return;

          static const int intervals_min[] = {0, 60, 120, 180, 240, 360, 480, 720, 1440};
          int interval_sec = intervals_min[idx] * 60;

          // Run Duration: Index 0 = 1 min, Index 29 = 30 min
          int run_idx = id(run_duration).active_index().value_or(4);
          uint32_t run_ms = (run_idx + 1) * 60000;

          uint32_t elapsed = millis() - id(last_cycle_start);

          auto time = id(sntp_time).now();
          bool has_time = time.is_valid();

          if (id(cycle_running) && id(relay_hw).state) {
            // Zyklus läuft - prüfe ob Laufzeit vorbei
            if (elapsed >= run_ms) {
              id(relay_hw).turn_off();
              id(cycle_running) = false;
              ESP_LOGI("timer", "Cycle ended");

              if (has_time && id(next_cycle_timestamp) > 0) {
                // Nächster Zyklus = letzter Start + Intervall (bereits runde Zeit)
                time_t next = id(next_cycle_timestamp) + interval_sec;
                id(next_cycle_timestamp) = next;
                ESP_LOGI("timer", "Next cycle at %02d:00", (int)((next % 86400) / 3600));
              }
            }
          } else if (!id(relay_hw).state) {
            // Planung immer (auch bei Fault)
            if (has_time) {
              if (id(next_cycle_timestamp) == 0) {
                time_t next = time.timestamp + interval_sec;
                next = ((next / 3600) + 1) * 3600;
                id(next_cycle_timestamp) = next;
                ESP_LOGI("timer", "Cycle scheduled at %02d:00", (int)((next % 86400) / 3600));
              }
              // Einschalten nur ohne Fault
              if (!id(fault_active) && time.timestamp >= id(next_cycle_timestamp)) {
                id(last_cycle_start) = millis();
                id(cycle_running) = true;
                id(relay_hw).turn_on();
                ESP_LOGI("timer", "Cycle started");
              }
            } else if (!id(fault_active)) {
              // Ohne SNTP: Fallback auf millis() (nur ohne Fault)
              uint32_t interval_ms = (uint32_t)interval_sec * 1000;
              if (elapsed >= interval_ms) {
                id(last_cycle_start) = millis();
                id(cycle_running) = true;
                id(relay_hw).turn_on();
                ESP_LOGI("timer", "Cycle started (no SNTP)");
              }
            }
          }

################################################
#
# BUTTONS
#
################################################

button:
  - platform: restart
    name: "Neustart"
    entity_category: config

  - platform: factory_reset
    name: "Werksreset"
    id: factory_reset_button
    entity_category: config

  - platform: safe_mode
    name: "Sicherheitsmodus"
    entity_category: config

  - platform: template
    name: "Spitzenwert zurücksetzen"
    icon: "mdi:chart-line-variant"
    entity_category: config
    on_press:
      - lambda: 'id(peak_current) = 0.0;'

################################################
#
# TEXT SENSOREN
#
################################################

text_sensor:
  - platform: template
    name: "Zyklus (letzter)"
    id: last_cycle_time
    icon: "mdi:clock-start"
    lambda: |-
      if (id(timer_interval).active_index().value_or(0) == 0) {
        return {"—"};
      }
      auto time = id(sntp_time).now();
      if (!time.is_valid()) {
        return {"—"};
      }
      // Berechne Uhrzeit des letzten Zyklus
      uint32_t elapsed_sec = (millis() - id(last_cycle_start)) / 1000;
      time_t last_time = time.timestamp - elapsed_sec;
      auto last = ESPTime::from_epoch_local(last_time);
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", last.hour, last.minute);
      return {buf};
    update_interval: 10s

  - platform: template
    name: "Zyklus (nächster)"
    id: next_cycle_time
    icon: "mdi:clock-end"
    lambda: |-
      if (id(next_cycle_timestamp) == 0) {
        return {"—"};
      }
      auto next = ESPTime::from_epoch_local(id(next_cycle_timestamp));
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", next.hour, next.minute);
      return {buf};
    update_interval: 10s

  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic
    ssid:
      name: "Verbundenes WLAN"
      entity_category: diagnostic
    mac_address:
      name: "MAC-Adresse"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome-Version"
    entity_category: diagnostic

################################################
#
# ZEIT
#
################################################

time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
